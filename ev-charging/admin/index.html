<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/megawatt-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Megawatt Admin</title>
    <script>
      // Prevent theme flash: apply dark class before React loads.
      (function () {
        try {
          var key = "mw_theme";
          var stored = localStorage.getItem(key);
          var preferred = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored || (preferred ? "dark" : "light");
          if (theme === "dark") document.documentElement.classList.add("dark");
          else document.documentElement.classList.remove("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
